version: '3.8'

services:
  dungeon-backend:
    build: .
    container_name: dungeon-backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data  # Maps the local 'data' folder to the container's data folder
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    restart: unless-stopped